/* ==================== 工具函数 ==================== */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
const money = v => {
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' 万';
  return Math.round(v).toLocaleString('zh-CN');
};
const wan = v => (v / 10000).toFixed(1) + ' 万';
const pct = v => v.toFixed(1) + '%';

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

function copyText(text, label){
  navigator.clipboard.writeText(text).then(
    () => toast((label || '内容') + '已复制到剪贴板'),
    () => toast('复制失败，请手动选择文字')
  );
}

function switchView(name){

  $('#pageTitle').textContent = meta.t;
  $('#pageDesc').textContent = meta.d;
  $('#content').scrollTop = 0;
  if (name === 'qa') setTimeout(() => { const i = $('#chatInput'); if (i) i.focus(); }, 50);

    if (typeof bindInsuranceIO === 'function') bindInsuranceIO();

  }, 30);
}

/* 客户诊断规则 */
function clientDiagnosis(c){
  const out = [];
  const eq = c.holdings.filter(h => /权益|QDII|私募证券/.test(h.n)).reduce((s,h) => s + h.pct, 0);
  const cash = c.holdings.filter(h => /现金|存款/.test(h.n)).reduce((s,h) => s + h.pct, 0);
  const ins = c.holdings.filter(h => /增额|年金|保险/.test(h.n)).reduce((s,h) => s + h.pct, 0);
  const base = ALLOC_MODEL[c.risk];

  if (Math.abs(eq - base.equity) > 8){
    out.push({title:'权益仓位偏离基准', text:`当前权益类 ${eq.toFixed(1)}%，C${c.risk} 基准为 ${base.equity}%，偏离 ${(eq-base.equity).toFixed(1)}pct。${eq > base.equity ? '建议在反弹中逐步降低至基准附近。' : '在风险承受范围内可适度补足。'}`});
  }
  if (cash > base.cash + 5){
    out.push({title:'闲置现金偏高', text:`现金及存款占比 ${cash.toFixed(1)}%，高于基准 ${base.cash}%。约 ${wan((cash-base.cash)/100*c.aum)} 资金处于低效状态，可考虑转入现金管理类或短债。`});
  }
  if (ins < base.ins - 5){
    out.push({title:'保障配置缺口', text:`保障类资产仅 ${ins.toFixed(1)}%，低于 C${c.risk} 基准 ${base.ins}%。长期确定性现金流不足，建议补充增额终身寿或年金。`});
  }
  if (c.risk <= 2 && eq > 15){
    out.push({title:'适当性风险提示', text:`稳健型客户权益占比 ${eq.toFixed(1)}%，存在适当性错配风险，需在下一次方案中明确说明波动区间。`});
  }
  if (!out.length){
    out.push({title:'配置结构健康', text:'当前配置与风险等级基本匹配，建议保持并关注再平衡窗口。', ok:true});
  }
  return out;
}
