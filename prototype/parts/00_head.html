<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisra · 明策</title>
<style>
:root{
  --bg:#0f1419; --bg2:#151c23; --card:#1a222b; --card2:#202a35;
  --line:#2a3542; --line2:#35424f;
  --txt:#e8eef4; --txt2:#9fb0c0; --txt3:#6b7d8f;
  --acc:#4ea8de; --acc2:#3d8bb8;
  --gold:#d4a24c; --green:#3fb950; --red:#f85149; --amber:#d29922;
  --radius:10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#33404d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#455362}

/* ========== 布局 ========== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:224px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ========== 侧栏 ========== */
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;gap:12px}
.logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#4ea8de,#2b6f9e);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:#fff;
  font-family:var(--font);letter-spacing:0;
  box-shadow:0 2px 8px rgba(78,168,222,.32);
  position:relative;
}
.logo::after{
  content:'';position:absolute;inset:0;border-radius:9px;
  border:1px solid rgba(255,255,255,.18);
}
.brand-name{font-size:16px;font-weight:600;letter-spacing:2px;line-height:1.2}
.brand-sub{font-size:9.5px;color:var(--txt3);margin-top:3px;letter-spacing:2.2px;font-weight:500}

nav{padding:14px 10px;flex:1;overflow-y:auto}
.nav-label{
  font-size:10.5px;color:var(--txt3);text-transform:uppercase;
  letter-spacing:1.2px;padding:8px 10px 6px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:8px;cursor:pointer;
  color:var(--txt2);font-size:13.5px;margin-bottom:2px;
  transition:background .15s,color .15s;position:relative;
  user-select:none;
}
.nav-item:hover{background:#1e2732;color:var(--txt)}
.nav-item.active{background:#22303d;color:#fff;font-weight:500}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;background:var(--acc);border-radius:0 3px 3px 0;
}
.nav-item .ico{width:17px;text-align:center;font-size:14px;opacity:.85;flex-shrink:0}
.nav-item .tag{
  margin-left:auto;font-size:10px;background:#2a3a48;color:var(--acc);
  padding:1px 6px;border-radius:4px;font-weight:600;
}

.sidebar-foot{
  padding:12px 14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--txt3);line-height:1.7;
}
.status-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-right:6px;
  box-shadow:0 0 6px rgba(63,185,80,.6);
}

/* ========== 顶栏 ========== */
.topbar{
  height:58px;flex-shrink:0;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 24px;gap:16px;background:var(--bg2);
}
.page-title{font-size:15.5px;font-weight:600}
.page-desc{font-size:12px;color:var(--txt3);margin-left:10px;padding-left:10px;border-left:1px solid var(--line2)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.market-pill{
  display:flex;gap:16px;font-size:12px;font-family:var(--mono);
  background:#1b242d;padding:6px 14px;border-radius:7px;border:1px solid var(--line);
}
.market-pill .mi{display:flex;gap:6px;align-items:center;white-space:nowrap}
.market-pill .nm{color:var(--txt3);font-family:var(--font);font-size:11.5px}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--txt2)}
.avatar{
  width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3d5a73,#233a4d);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#cfe3f2;font-weight:600;border:1px solid var(--line2);
}

.content{flex:1;overflow-y:auto;padding:22px 24px 40px}
.view{display:none}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ========== 通用组件 ========== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;
}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sub{font-size:11.5px;color:var(--txt3);font-weight:400}
.card-h .right{margin-left:auto;font-size:12px;color:var(--txt3)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:7px;border:1px solid var(--line2);
  background:var(--card2);color:var(--txt);font-size:13px;cursor:pointer;
  font-family:var(--font);transition:all .15s;white-space:nowrap;
}
.btn:hover{background:#28343f;border-color:#42505f}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--acc2);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tag-pill{
  display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;
  background:#22303d;color:var(--acc);border:1px solid #2d4256;
}
.tag-pill.gold{background:#332a17;color:var(--gold);border-color:#4a3c1f}
.tag-pill.green{background:#16291c;color:var(--green);border-color:#22452c}
.tag-pill.red{background:#2d1a19;color:var(--red);border-color:#4a2a27}
.tag-pill.amber{background:#2e2615;color:var(--amber);border-color:#4a3f22}
.tag-pill.gray{background:#232c35;color:var(--txt2);border-color:#313c48}

.empty-hint{color:var(--txt3);font-size:12.5px;text-align:center;padding:26px 0}

input[type=text],input[type=number],select,textarea{
  background:#131a21;border:1px solid var(--line2);border-radius:7px;
  color:var(--txt);padding:8px 11px;font-size:13px;font-family:var(--font);
  outline:none;transition:border-color .15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{resize:vertical;line-height:1.65}

/* ========== 首页概览 ========== */
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
}
.stat::after{
  content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;
  border-radius:50%;background:rgba(78,168,222,.05);
}
.stat .k{font-size:11.5px;color:var(--txt3);margin-bottom:7px}
.stat .v{font-size:25px;font-weight:600;font-family:var(--mono);letter-spacing:-.5px}
.stat .v .unit{font-size:12px;color:var(--txt3);font-family:var(--font);margin-left:3px;font-weight:400}
.stat .d{font-size:11.5px;color:var(--txt3);margin-top:6px}

.todo-list{list-style:none}
.todo-item{
  display:flex;align-items:flex-start;gap:11px;padding:11px 0;
  border-bottom:1px solid #212b35;font-size:13px;
}
.todo-item:last-child{border-bottom:none}
.todo-item .dot{
  width:6px;height:6px;border-radius:50%;margin-top:8px;flex-shrink:0;
}
.todo-item .body{flex:1;min-width:0}
.todo-item .t{color:var(--txt)}
.todo-item .m{font-size:11.5px;color:var(--txt3);margin-top:2px}
.todo-item .go{
  font-size:11.5px;color:var(--acc);cursor:pointer;white-space:nowrap;
  padding:2px 8px;border-radius:5px;transition:background .12s;
}
.todo-item .go:hover{background:#22303d}

/* ========== 客户列表 ========== */
.client-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.client-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.client-search{padding:10px}
.client-search input{font-size:12.5px;padding:7px 10px}
.client-item{
  padding:11px 14px;border-top:1px solid #212b35;cursor:pointer;
  transition:background .12s;
}
.client-item:hover{background:#1e2731}
.client-item.active{background:#22303d;box-shadow:inset 3px 0 0 var(--acc)}
.client-item .n{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.client-item .s{font-size:11.5px;color:var(--txt3);margin-top:3px;font-family:var(--mono)}
.risk-badge{
  font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600;
}
.r1,.r2{background:#16291c;color:var(--green)}
.r3{background:#2e2615;color:var(--amber)}
.r4,.r5{background:#2d1a19;color:var(--red)}

.kv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kv{padding:10px 12px;background:#161e26;border-radius:8px;border:1px solid #232e39}
.kv .k{font-size:11px;color:var(--txt3)}
.kv .v{font-size:14.5px;font-weight:600;margin-top:3px;font-family:var(--mono)}
.kv .v.small{font-size:13px;font-family:var(--font);font-weight:500}

.bar-wrap{height:9px;background:#131a21;border-radius:5px;overflow:hidden;display:flex}
.bar-seg{height:100%;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:12px}
.legend-i{display:flex;align-items:center;gap:6px;color:var(--txt2)}
.legend-i .sq{width:9px;height:9px;border-radius:2px;flex-shrink:0}

.diag{
  padding:11px 14px;border-radius:8px;background:#161e26;border:1px solid #232e39;
  border-left:3px solid var(--amber);font-size:12.8px;margin-bottom:9px;
}
.diag .h{color:var(--amber);font-weight:600;font-size:12px;margin-bottom:3px}
.diag.ok{border-left-color:var(--green)}
.diag.ok .h{color:var(--green)}

/* ========== 问答 ========== */
.qa-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.chat-box{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:480px;
}
.chat-scroll{flex:1;overflow-y:auto;padding:18px 20px}
.msg{margin-bottom:18px;display:flex;gap:10px}
.msg.me{flex-direction:row-reverse}
.msg .av{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:600;
}
.msg.me .av{background:#2d3f4f;color:#9fc7e4}
.msg.ai .av{background:linear-gradient(135deg,#4ea8de,#2b6f9e);color:#fff}
.bubble{
  max-width:88%;padding:12px 15px;border-radius:10px;font-size:13.3px;line-height:1.75;
}
.msg.me .bubble{background:#25323e;border-top-right-radius:3px}
.msg.ai .bubble{background:#17202a;border:1px solid #263342;border-top-left-radius:3px;max-width:100%}

.ai-block{margin-bottom:13px}
.ai-block:last-child{margin-bottom:0}
.ai-block .lb{
  font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.5px;
  margin-bottom:5px;display:flex;align-items:center;gap:6px;
}
.ai-block .lb span.n{
  width:16px;height:16px;border-radius:4px;background:#22303d;color:var(--acc);
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;
}
.ai-block p{color:var(--txt);font-size:13.2px}
.ai-block .em{color:#fff;font-weight:600}
.src-link{
  color:var(--acc);font-size:11px;text-decoration:none;cursor:pointer;
  border-bottom:1px dashed #3d5a73;margin-left:5px;
}
.src-link:hover{color:#7cc4ea}

.compliance-box{
  background:#1c1f18;border:1px solid #3a3f24;border-radius:8px;
  padding:9px 12px;font-size:11.8px;color:#c9c187;margin-top:11px;
}
.compliance-box.warn{background:#241a1a;border-color:#4d2c2c;color:#e0a3a3}

.chat-input-area{
  border-top:1px solid var(--line);padding:12px 16px;flex-shrink:0;
}
.chat-input-row{display:flex;gap:9px;align-items:flex-end}
.chat-input-row textarea{flex:1;min-height:42px;max-height:110px;padding:10px 12px}
.quick-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{
  font-size:11.5px;padding:5px 11px;border-radius:14px;
  background:#1e2732;border:1px solid var(--line);color:var(--txt2);
  cursor:pointer;transition:all .13s;white-space:nowrap;
}
.chip:hover{background:#26323e;color:var(--txt);border-color:var(--line2)}

.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px}
.side-card h4{font-size:12.5px;font-weight:600;margin-bottom:10px;color:var(--txt)}
.info-row{display:flex;justify-content:space-between;font-size:12.2px;padding:5px 0;color:var(--txt2)}
.info-row .v{color:var(--txt);font-family:var(--mono);font-size:12px}

.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{
  width:6px;height:6px;border-radius:50%;background:var(--txt3);
  animation:blink 1.3s infinite;
}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ========== 配置方案 ========== */
.wizard-steps{display:flex;gap:0;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 20px}
.wstep{flex:1;display:flex;align-items:center;gap:9px;position:relative}
.wstep:not(:last-child)::after{
  content:'';flex:1;height:1px;background:var(--line2);margin:0 12px;
}
.wstep .num{
  width:24px;height:24px;border-radius:50%;background:#232e39;color:var(--txt3);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex-shrink:0;
}
.wstep.on .num{background:var(--acc2);color:#fff}
.wstep.done .num{background:#1f4a2c;color:var(--green)}
.wstep .lbl{font-size:12.5px;color:var(--txt3);white-space:nowrap}
.wstep.on .lbl{color:var(--txt);font-weight:500}
.wstep.done .lbl{color:var(--txt2)}

.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.field label{display:block;font-size:11.5px;color:var(--txt3);margin-bottom:5px}
.allocation-vis{display:flex;gap:20px;align-items:flex-start}
.donut-wrap{position:relative;width:170px;height:170px;flex-shrink:0}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.donut-center .big{font-size:21px;font-weight:600;font-family:var(--mono)}
.donut-center .sml{font-size:10.5px;color:var(--txt3);margin-top:1px}

.alloc-table{flex:1;min-width:0}
.alloc-row{
  display:grid;grid-template-columns:14px 1fr 96px 62px;gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid #212b35;font-size:12.8px;
}
.alloc-row:last-child{border-bottom:none}
.alloc-row .nm{display:flex;flex-direction:column}
.alloc-row .nm .d{font-size:10.5px;color:var(--txt3)}
.alloc-row .amt{font-family:var(--mono);text-align:right;font-size:12.5px}
.alloc-row .pct{font-family:var(--mono);text-align:right;color:var(--txt2);font-size:12.5px}

.product-card{
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  background:#161e26;margin-bottom:10px;
}
.product-card:last-child{margin-bottom:none}
.pc-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pc-n{font-size:13px;font-weight:600}
.pc-meta{display:flex;gap:18px;font-size:11.5px;color:var(--txt3);margin-top:5px;flex-wrap:wrap}
.pc-meta b{color:var(--txt2);font-weight:500;font-family:var(--mono)}

/* ========== 保险 ========== */
.ins-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.ins-result .big-num{
  display:flex;gap:28px;margin-bottom:16px;flex-wrap:wrap;
}
.big-item .k{font-size:11.5px;color:var(--txt3);margin-bottom:4px}
.big-item .v{font-size:22px;font-weight:600;font-family:var(--mono);color:var(--gold)}
.big-item .v small{font-size:12px;color:var(--txt3);font-family:var(--font);font-weight:400;margin-left:2px}

table.data-tbl{width:100%;border-collapse:collapse;font-size:12.3px}
table.data-tbl th{
  text-align:right;padding:8px 10px;color:var(--txt3);font-weight:500;
  border-bottom:1px solid var(--line2);font-size:11.5px;white-space:nowrap;
}
table.data-tbl th:first-child,table.data-tbl td:first-child{text-align:left}
table.data-tbl td{
  text-align:right;padding:7px 10px;border-bottom:1px solid #212b35;
  font-family:var(--mono);font-size:12px;
}
table.data-tbl tbody tr:hover{background:#1a2430}

.human-talk{
  background:#17221a;border:1px solid #24402c;border-radius:8px;
  padding:11px 14px;font-size:12.8px;color:#b8d8c1;margin-bottom:10px;
}
.human-talk .lab{font-size:11px;color:#6aa87d;font-weight:600;margin-bottom:4px}

.obj-item{
  border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden;
  background:#161e26;
}
.obj-q{
  padding:10px 14px;font-size:12.8px;cursor:pointer;display:flex;
  align-items:center;gap:8px;user-select:none;
}
.obj-q:hover{background:#1c2631}
.obj-q .arrow{margin-left:auto;color:var(--txt3);font-size:10px;transition:transform .2s}
.obj-item.open .arrow{transform:rotate(90deg)}
.obj-a{
  display:none;padding:0 14px 12px 14px;font-size:12.5px;
  color:var(--txt2);line-height:1.75;border-top:1px solid #212b35;padding-top:10px;
}
.obj-item.open .obj-a{display:block}

/* ========== Toast ========== */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#28343f;border:1px solid #3d4c5b;color:#e8eef4;
  padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;
  opacity:0;transition:all .25s;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.45);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1200px){
  .qa-layout,.ins-layout{grid-template-columns:1fr}
  .client-layout{grid-template-columns:210px 1fr}
  .hero-stats .g4{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
}
/* ========== 文件导入 ========== */
.drop-zone{
  border:1.5px dashed #34414f;border-radius:9px;padding:22px 16px;text-align:center;
  cursor:pointer;transition:all .18s;background:#151d24;
}
.drop-zone:hover{border-color:var(--acc2);background:#18222b}
.drop-zone.over{border-color:var(--acc);background:#1a2836;transform:scale(1.005)}
.dz-ico{font-size:26px;margin-bottom:6px;opacity:.75}
.dz-t{font-size:13px;color:var(--txt)}
.dz-s{font-size:11.5px;color:var(--txt3);margin-top:4px}

.parse-loading{padding:16px;text-align:center;font-size:12.5px;color:var(--acc)}
.parse-ok{margin-top:12px;background:#15211a;border:1px solid #23402c;border-radius:8px;padding:12px 14px}
.po-h{font-size:12.5px;color:#6cc98a;font-weight:600;margin-bottom:9px}
.po-list{display:flex;flex-direction:column;gap:0}
.po-row{display:flex;gap:10px;font-size:12.2px;padding:4px 0;border-bottom:1px solid #1e2f24}
.po-row:last-child{border-bottom:none}
.po-row .k{color:var(--txt3);width:88px;flex-shrink:0}
.po-row .v{color:var(--txt);flex:1;word-break:break-all}
.po-note{font-size:11.5px;color:var(--txt3);margin-top:8px;line-height:1.6}
.po-more{color:var(--acc);cursor:pointer;font-size:11px;margin-left:5px;white-space:nowrap}
.po-more:hover{text-decoration:underline}
.po-list{max-height:340px;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.po-list::-webkit-scrollbar{width:6px}
.po-list::-webkit-scrollbar-thumb{background:#3d4c5b;border-radius:3px}
.parse-err{margin-top:12px;background:#241a1a;border:1px solid #4d2c2c;border-radius:8px;padding:11px 14px;font-size:12.3px;color:#e0a3a3}

.col-pick{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
.chip.on{background:#22303d;border-color:var(--acc);color:var(--acc);font-weight:500}

.tbl-scroll{overflow-x:auto}
.tbl-scroll table{min-width:620px}

.big-num{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px}
.big-item .k{font-size:11.5px;color:var(--txt3);margin-bottom:4px}
.big-item .v{font-size:21px;font-weight:600;font-family:var(--mono);color:var(--gold)}
.big-item .v small{font-size:12px;color:var(--txt3);font-family:var(--font);font-weight:400;margin-left:2px}

/* ========== 保险模块：分区与结果分栏 ========== */
.section-divider{display:flex;align-items:center;gap:14px;margin:22px 0 16px}
.section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#2a3542,transparent)}
.section-divider .txt{font-size:12px;color:var(--txt3);white-space:nowrap;letter-spacing:.3px}

.sub-h{font-size:12.5px;color:var(--txt2);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sub-h .hint{font-size:11px;color:var(--txt3);font-weight:400}

.drop-zone.compact{padding:16px 14px}
.drop-zone.compact .dz-ico{font-size:22px;margin-bottom:4px}

.result-split{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.chart-title{font-size:12px;color:var(--txt3);margin:14px 0 6px}

@media(max-width:1280px){
  .result-split{grid-template-columns:1fr}
}
/* ========== 吸顶表头 ========== */
/* 容器内滚动时表头固定在顶部 */
/* ========== 吸顶表头 ==========
   方案：容器内独立滚动 + thead 吸附
   - 表格在自身容器内滚动，页面不会被撑长
   - 滚动时表头固定在容器顶部，列名始终可见
   - 首行始终从表头下方开始，不会被遮挡
   - 短表格高度自适应，不出现多余滚动条 */
.sticky-tbl{
  position:relative;
  max-height:520px;
  overflow-y:auto;
  overflow-x:auto;
  border-radius:8px;
  scrollbar-width:thin;
}
/* 强制显示滚动条，让用户知道表内可滚动 */
.sticky-tbl{scrollbar-color:#4a5a6b #151d24;scrollbar-width:thin}
.sticky-tbl::-webkit-scrollbar{width:9px;height:9px;display:block}
.sticky-tbl::-webkit-scrollbar-thumb{background:#4a5a6b;border-radius:5px;border:2px solid #151d24}
.sticky-tbl::-webkit-scrollbar-thumb:hover{background:#5c6e80}
.sticky-tbl::-webkit-scrollbar-track{background:#151d24;border-radius:5px}
.sticky-tbl table{border-collapse:separate;border-spacing:0}
.sticky-tbl thead th{
  position:sticky;
  top:0;
  z-index:4;
  background:#1c2632;
  box-shadow:0 1px 0 var(--line2), 0 8px 14px -10px rgba(0,0,0,.9);
}
.sticky-tbl thead th:first-child{border-top-left-radius:8px}
.sticky-tbl thead th:last-child{border-top-right-radius:8px}
/* 含表格的卡片不裁切，否则 sticky 失效 */
.card.has-sticky{overflow:visible}
.scroll-hint{font-size:11px;color:var(--acc);opacity:.8}
</style>
